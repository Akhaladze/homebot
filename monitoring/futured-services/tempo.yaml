server:
  http_listen_port: 3200
  log_level: info

# --- Кластеризация (Спасает от panic: invalid memory address) ---
memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946
  join_members: [localhost]

distributor:
  ring:
    kvstore:
      store: memberlist
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 1

# --- Хранилище ---
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# --- Метрики из трейсов (оставляем, раз они нужны для Alloy) ---
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
