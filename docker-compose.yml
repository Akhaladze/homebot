version: '3.8'

services:
  homebot:
    build: 
      context: .
      dockerfile: Dockerfile
    image: akhaladze/iot-homebot:latest
    volumes:
      - ./data:/app/data
      - ./homebot:/app/homebot
      - ./network.db:/app/network.db
    env_file:
      - .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: ["gunicorn", "--chdir", "homebot", "-w", "4", "-b", "0.0.0.0:5000", "app:app"]
